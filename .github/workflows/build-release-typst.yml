name: Build and release

on:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  build_release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: '0'

      - name: Create initial tag
        run: |
          if [ -z "$(git tag -l 'v*')" ]; then
            git tag v0.0.0
          fi

      - name: Bump version and push tag
        id: bump
        uses: anothrNick/github-tag-action@1.75.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          WITH_V: true
          DEFAULT_BUMP: 'patch'

      - uses: typst-community/setup-typst@v5
        with:
          typst-version: 0.15.1
      - run: typst fonts --font-path fonts
      - run: typst compile --font-path fonts main.typ main.pdf
      - run: typst compile --root . --font-path fonts tests/twoside.typ twoside.pdf
      - name: Check that invalid dates are rejected
        run: "! typst compile --root . --font-path fonts tests/invalid-date.typ invalid.pdf"

      - name: Create Release
        id: create_release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ steps.bump.outputs.new_tag }}
          name: Version ${{ steps.bump.outputs.new_tag }}
          draft: false
          prerelease: false
          files: |
            main.pdf
            twoside.pdf
